# Full verification loop (constitution Principle XVI): same command as local `npm run check:all`.
name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check-all:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: paylens
          POSTGRES_PASSWORD: paylens
          POSTGRES_DB: paylens_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U paylens"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      HUSKY: "0"
      TEST_DATABASE_URL: postgresql+psycopg://paylens:paylens@localhost:5432/paylens_test
      E2E_DATABASE_URL: postgresql+psycopg://paylens:paylens@localhost:5432/paylens_e2e
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: |
            package-lock.json
            frontend/package-lock.json

      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          cache-dependency-glob: backend/uv.lock

      - name: Install dependencies
        run: |
          npm ci
          npm ci --prefix frontend
          uv sync --directory backend --locked

      - name: Install Playwright browser
        run: npx --prefix frontend playwright install --with-deps chromium

      - name: Create e2e database
        env:
          PGPASSWORD: paylens
        run: psql -h localhost -U paylens -d paylens_test -c "CREATE DATABASE paylens_e2e"

      - name: Verification loop
        run: npm run check:all

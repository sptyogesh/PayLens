[project]
name = "paylens-backend"
version = "0.1.0"
description = "PayLens backend: PayPal sandbox sync and leakage engine (Phase 1A)"
license = "MIT"
requires-python = ">=3.11,<3.14"
dependencies = [
    "fastapi>=0.162.2",
    "httpx>=0.28.1",
    "psycopg[binary]>=3",
    "pydantic>=2",
    "pydantic-settings>=2.16.2",
    "sqlalchemy>=2",
    "uvicorn[standard]>=0.54.0",
]

[dependency-groups]
dev = [
    "freezegun>=1.5.5",
    "hypothesis>=6.170.15",
    "mypy>=2.4.1",
    "pytest>=9.2.0",
    "pytest-cov>=7.1.0",
    "respx>=0.23.1",
    "ruff>=0.17.4",
]

[tool.uv]
package = false

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "N", "S", "C4", "SIM", "RUF", "PL", "DTZ", "T20"]
ignore = ["PLR0913"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "PLR2004", "S105", "S106"]
"scripts/**" = ["T201"]

[tool.mypy]
strict = true
python_version = "3.12"
plugins = ["pydantic.mypy"]
mypy_path = "."
explicit_package_bases = true

[tool.pydantic-mypy]
init_forbid_extra = true
init_typed = true
warn_required_dynamic_aliases = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra --strict-markers"
markers = ["slow: slower tests excluded from the pre-push hook"]

[tool.coverage.run]
source = ["app"]
branch = true

[tool.coverage.report]
fail_under = 70
show_missing = true
skip_covered = true
